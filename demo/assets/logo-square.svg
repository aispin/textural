<!-- 满幅方版：给 PWA maskable / apple-touch-icon 用，图形收在安全区（80% 圆）内 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Textural">
  <defs>
    <linearGradient id="tgrad-sq" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#a678ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#tgrad-sq)"/>
  <g fill="#ffffff" transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <rect x="17" y="19" width="30" height="7" rx="3.5"/>
    <rect x="28.5" y="19" width="7" height="26" rx="3.5"/>
  </g>
</svg>
