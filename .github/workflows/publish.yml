# 发布：release-please 依据 Conventional Commits 决定版本号，然后直接发版（不开 Release PR）。
#
# 推 main → 分析提交 → 有 feat/fix 就：打 tag、建 GitHub Release、npm publish
#   fix: → patch ｜ feat: → minor ｜ feat!: 或 body 里写 BREAKING CHANGE: → major
#   docs: / chore: / ci: / style: / refactor: → 不发版
#
# 为什么不开 Release PR（试过，两条死路）：
#   1) 让 release-please 开 PR + 挂 GitHub 原生 auto-merge：auto-merge 要求目标分支配了
#      分支保护规则，否则报 "Protected branch rules not configured for this branch"。
#   2) 退回「workflow 里用 gh pr merge 合并」：GITHUB_TOKEN 合并产生的 push 不触发下游
#      workflow（防递归），而且**workflow 无法再给这次合并创建 Release**
#      （实测 403 Resource not accessible by integration，而 token 权限确实是 contents: write）。
#   所以这里用 `skip-github-pull-request: true`：不开 PR，直接建 tag + Release。
#   需要人工闸门时：把 npmjs.com 的 Allowed actions 改成只允许 `npm stage publish`，
#   再把下面的 `npm publish` 换成 `npm stage publish`，之后每版都要维护者过 2FA 批准。
#
# 认证：npm Trusted Publishing（OIDC），仓库里没有任何令牌，provenance 自动生成。
#   ⚠️ npmjs.com → @aifire/textural → Settings → Trusted Publisher 绑定的 workflow 文件名
#      必须仍是 **publish.yml**。
#
# 手动补发（比如某次 tag 建好了但 npm publish 失败）：Actions → Release → Run workflow，
# 勾上 publish_current_version，会按 package.json 当前版本重新构建并发布。

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current_version:
        description: '跳过版本判定，直接按 package.json 当前版本构建并发布（补发用）'
        type: boolean
        default: false

permissions:
  contents: write   # 打 tag、建 GitHub Release
  id-token: write   # OIDC：Trusted Publishing 的必需品

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.flag.outputs.publish }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - id: flag
        name: Decide whether to publish
        run: |
          set -euo pipefail
          publish="${{ steps.release.outputs.release_created == 'true' || inputs.publish_current_version == true }}"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release_created=${{ steps.release.outputs.release_created }} / forced=${{ inputs.publish_current_version }} → publish=$publish"

  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # 不传 registry-url：避免 .npmrc 里出现空的 ${NODE_AUTH_TOKEN} 干扰 OIDC；
          # registry 与 access 由 package.json 的 publishConfig 提供。

      # Trusted Publishing 要 npm CLI ≥ 11.5.1，Node 自带的 npm 不保证够新。
      - name: Install latest npm
        run: |
          npm install -g npm@latest
          node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 不传 NODE_AUTH_TOKEN：npm CLI 在 GitHub Actions 里自动用 OIDC 换临时凭证。
      - name: Publish to npm
        run: npm publish
