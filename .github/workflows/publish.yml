# 发布：release-please 算版本 → 合并 Release PR → 打 tag、建 GitHub Release、npm publish
#
# 推 main（带 feat/fix 等）→ release-please 开/更新一个 Release PR（里面已改好
#   package.json 的 version、CHANGELOG.md、.release-please-manifest.json）
# → **你合并这个 PR** → 本次 workflow 在合并后的推送里完成 tag + Release + npm 发布
#   docs:/chore:/ci:/style:/refactor: 不触发发版。
#   版本规则：feat: → minor ｜ fix: → patch ｜ feat!: 或 body 里写 BREAKING CHANGE: → major
#
# ⚠️ 为什么保留「合并」这一次人工点击 —— 两条全自动路线都实测被 GitHub 挡住：
#   1) 挂 GitHub 原生 auto-merge：仓库没有分支保护规则，直接报
#      "Protected branch rules not configured for this branch"。
#   2) 由 workflow 用 GITHUB_TOKEN 合并：这种 push 不触发下游 workflow（防递归），
#      而且这个 workflow 无法再给那次合并创建 Release
#      （403 Resource not accessible by integration，而 token 权限确实是 contents: write）。
#   注：`skip-github-pull-request: true` 也不行 —— 那个模式只负责「收尾已合并的 Release PR」，
#   不会从裸提交直接发版（实测它永远判定"没有可发版本"）。
#   想连这一次点击都省掉：给仓库配一个 PAT 或 GitHub App token 来合并（需要长期凭证，谨慎）。
#
# 认证：npm Trusted Publishing（OIDC），仓库里没有任何令牌，provenance 自动生成。
#   ⚠️ npmjs.com → @aifire/textural → Settings → Trusted Publisher 绑定的 workflow 文件名
#      必须仍是 **publish.yml**。
#   想给每次发版加人工闸门：Allowed actions 只勾 `npm stage publish`，
#   再把下面的 `npm publish` 换成 `npm stage publish`，然后去 npmjs.com 过 2FA。
#
# 手动补发（tag 建好了但 npm 发布失败）：Actions → Release → Run workflow，
# 勾上 publish_current_version，会按 package.json 当前版本重新构建并发布。

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current_version:
        description: '跳过版本判定，直接按 package.json 当前版本构建并发布（补发用）'
        type: boolean
        default: false

permissions:
  contents: write        # 打 tag、建 GitHub Release
  pull-requests: write   # 开/更新 Release PR
  id-token: write        # OIDC：Trusted Publishing 的必需品

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.flag.outputs.publish }}
    steps:
      # 合并 Release PR 的那次运行会返回 release_created=true
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: flag
        name: Decide whether to publish
        run: |
          set -euo pipefail
          publish="${{ steps.release.outputs.release_created == 'true' || inputs.publish_current_version == true }}"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release_created=${{ steps.release.outputs.release_created }} / forced=${{ inputs.publish_current_version }} → publish=$publish"

  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # 不传 registry-url：避免 .npmrc 里出现空的 ${NODE_AUTH_TOKEN} 干扰 OIDC；
          # registry 与 access 由 package.json 的 publishConfig 提供。

      # Trusted Publishing 要 npm CLI ≥ 11.5.1，Node 自带的 npm 不保证够新。
      - name: Install latest npm
        run: |
          npm install -g npm@latest
          node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 不传 NODE_AUTH_TOKEN：npm CLI 在 GitHub Actions 里自动用 OIDC 换临时凭证。
      - name: Publish to npm
        run: npm publish
