# 发布：release-please 依据 Conventional Commits 决定版本号，合并 Release PR 时才真正发出去
#
# 流程：
#   推 main（带 feat:/fix: 等）→ release-please 自动开/更新一个 Release PR
#     （PR 里已经改好 package.json 的 version 与 CHANGELOG.md）
#   → 你 review 并合并它 → 本次 workflow 打 tag、建 GitHub Release、npm publish
#   docs: / chore: / ci: / style: / refactor: 这类 commit 不会触发发版。
#
#   版本规则：feat: → minor ｜ fix: → patch ｜ feat!: 或 body 里写 BREAKING CHANGE: → major
#
# 认证：走 npm Trusted Publishing（OIDC），仓库里不需要任何令牌，provenance 自动生成。
#   ⚠️ npmjs.com → @aifire/textural → Settings → Trusted Publisher 里绑定的 workflow 文件名
#      必须仍是 **publish.yml**（这个名字是刻意保留的，改名要同步改 npm 上的配置）。
#   ⚠️ 想给每次发版加人工闸门：Allowed actions 只勾 `npm stage publish`，
#      再把下面的 `npm publish` 换成 `npm stage publish`，然后到 npmjs.com 的
#      Staged Packages 页用 2FA 批准（staged publishing 只能用于已存在的包）。
#   ⚠️ 绑好 Trusted Publisher 之前不要合并 Release PR：否则 tag 与 GitHub Release 会先建出来，
#      而 npm publish 会因为拿不到凭证失败。

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # 打 tag、建 GitHub Release
  pull-requests: write   # 开/更新 Release PR
  id-token: write        # OIDC：Trusted Publishing 的必需品

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1) 开/更新 Release PR；合并 Release PR 的那次运行会返回 release_created=true
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 让 Release PR 自己合：一开出来就挂上 GitHub 原生 auto-merge，
      # 必需检查通过（本仓库没配必需检查，等于立刻）后自动合入 → 全自动发版。
      # 想恢复人工闸门：删掉这一步（或把仓库设置里的 Allow auto-merge 关掉）。
      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 按分支名找，不按 label：label（autorelease: pending）是 release-please
          # 建完 PR 之后才补上的，早几秒跑会查不到（踩过）。
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                  --json number,headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --auto
            echo "已为 Release PR #$pr 开启自动合并"
          else
            echo "本次没有待处理的 Release PR"
          fi

      # 2) 只有真的要发版时，才构建并发布（非发版的推送在这里就结束了）
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 不传 registry-url：避免 .npmrc 里出现空的 ${NODE_AUTH_TOKEN} 干扰 OIDC；
          # registry 与 access 由 package.json 的 publishConfig 提供。

      # Trusted Publishing 要 npm CLI ≥ 11.5.1，Node 自带的 npm 不保证够新。
      - if: ${{ steps.release.outputs.release_created }}
        name: Install latest npm
        run: |
          npm install -g npm@latest
          node -v && npm -v

      - if: ${{ steps.release.outputs.release_created }}
        name: Install dependencies
        run: npm ci

      - if: ${{ steps.release.outputs.release_created }}
        name: Typecheck
        run: npm run typecheck

      - if: ${{ steps.release.outputs.release_created }}
        name: Build
        run: npm run build

      # 不传 NODE_AUTH_TOKEN：npm CLI 在 GitHub Actions 里自动用 OIDC 换临时凭证。
      - if: ${{ steps.release.outputs.release_created }}
        name: Publish to npm
        run: npm publish
