  </defs>
  <rect width="64" height="64" rx="20" fill="url(#tgrad-fav)"/>
  <g fill="#ffffff">
    <rect x="15" y="17" width="34" height="8" rx="4"/>
    <rect x="28" y="17" width="8" height="30" rx="4"/>
